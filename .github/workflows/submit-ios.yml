name: Submit iOS Build

on:
  workflow_dispatch:
    inputs:
      gymId:
        description: "Gym ID (copy from Convex dashboard)"
        required: true
        type: string
      buildId:
        description: "EAS build ID to submit. Recommended for white-label apps."
        required: false
        type: string
      whatToTest:
        description: "Optional TestFlight 'What to Test' text"
        required: false
        type: string

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup Node
        uses: actions/setup-node@v4.3.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y jq dnsutils

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Check required secrets
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          BUILD_SECRET: ${{ secrets.NORTHERNGLOW_BUILD_SECRET }}
        run: |
          test -n "$EXPO_TOKEN" || (echo "Missing EXPO_TOKEN repo secret" && exit 1)
          test -n "$BUILD_SECRET" || (echo "Missing NORTHERNGLOW_BUILD_SECRET repo secret" && exit 1)

      - name: Submit iOS build
        env:
          BUILD_SECRET: ${{ secrets.NORTHERNGLOW_BUILD_SECRET }}
          GYM_ID: ${{ inputs.gymId }}
          BUILD_ID: ${{ inputs.buildId }}
          WHAT_TO_TEST: ${{ inputs.whatToTest }}
        run: |
          args=("$GYM_ID" --env prod)

          if [ -n "$BUILD_ID" ]; then
            args+=(--build-id "$BUILD_ID")
          else
            args+=(--latest)
          fi

          if [ -n "$WHAT_TO_TEST" ]; then
            args+=(--what-to-test "$WHAT_TO_TEST")
          fi

          chmod +x ./scripts/submit-gym-ios.sh
          ./scripts/submit-gym-ios.sh "${args[@]}"
