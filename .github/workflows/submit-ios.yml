name: Submit iOS Build

on:
  workflow_dispatch:
    inputs:
      gymId:
        description: "Gym ID (copy from Convex dashboard)"
        required: true
        type: string
      buildId:
        description: "EAS build ID to submit. Recommended for white-label apps."
        required: false
        type: string
      ascAppId:
        description: "App Store Connect numeric app ID for this gym app"
        required: false
        type: string
      profile:
        description: "Submit profile"
        required: true
        type: choice
        options:
          - gym-production
          - gym-preview
        default: gym-production
      whatToTest:
        description: "Deprecated: ignored because EAS treats it as an Enterprise-only changelog"
        required: false
        type: string

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup Node
        uses: actions/setup-node@v4.3.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Check required secrets
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          BUILD_SECRET: ${{ secrets.NORTHERNGLOW_BUILD_SECRET }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_KEY_ISSUER_ID: ${{ secrets.ASC_API_KEY_ISSUER_ID }}
        run: |
          test -n "$EXPO_TOKEN" || (echo "Missing EXPO_TOKEN repo secret" && exit 1)
          test -n "$BUILD_SECRET" || (echo "Missing NORTHERNGLOW_BUILD_SECRET repo secret" && exit 1)
          test -n "$ASC_API_KEY_P8" || (echo "Missing ASC_API_KEY_P8 repo secret" && exit 1)
          test -n "$ASC_API_KEY_ID" || (echo "Missing ASC_API_KEY_ID repo secret" && exit 1)
          test -n "$ASC_API_KEY_ISSUER_ID" || (echo "Missing ASC_API_KEY_ISSUER_ID repo secret" && exit 1)

      - name: Submit iOS build
        env:
          BUILD_SECRET: ${{ secrets.NORTHERNGLOW_BUILD_SECRET }}
          GYM_ID: ${{ inputs.gymId }}
          BUILD_ID: ${{ inputs.buildId }}
          ASC_APP_ID: ${{ inputs.ascAppId }}
          PROFILE: ${{ inputs.profile }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_KEY_ISSUER_ID: ${{ secrets.ASC_API_KEY_ISSUER_ID }}
          WHAT_TO_TEST: ${{ inputs.whatToTest }}
        run: |
          ASC_API_KEY_PATH="$RUNNER_TEMP/asc_api_key.p8"
          printf '%s\n' "$ASC_API_KEY_P8" > "$ASC_API_KEY_PATH"
          chmod 600 "$ASC_API_KEY_PATH"

          args=("$GYM_ID" --env prod)
          args+=(--profile "$PROFILE")

          if [ -n "$BUILD_ID" ]; then
            args+=(--build-id "$BUILD_ID")
          else
            args+=(--latest)
          fi

          if [ -n "$ASC_APP_ID" ]; then
            args+=(--asc-app-id "$ASC_APP_ID")
          fi

          args+=(--asc-api-key-path "$ASC_API_KEY_PATH")
          args+=(--asc-api-key-id "$ASC_API_KEY_ID")
          args+=(--asc-api-key-issuer-id "$ASC_API_KEY_ISSUER_ID")

          if [ -n "$WHAT_TO_TEST" ]; then
            echo "Ignoring whatToTest because EAS treats it as an Enterprise-only changelog."
          fi

          chmod +x ./scripts/submit-gym-ios.sh
          ./scripts/submit-gym-ios.sh "${args[@]}"
